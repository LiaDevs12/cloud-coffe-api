name: Integracion Continua (CI)
on:
push:
braches: [ "main" ] 
pull_request:
braches: [ "main" ]
jobs: build-and-test:
steps: 
- name: Descargar codigo fuente (Checkout)
uses: actions/checkout@v4
-name: Configurar Node.js (v20)
uses: actions/setup-node@v4
with:
node-version:  '20'
cache: 'npm'
- name: Instalar dependencias
run: npm ci
- name: Ejecutar pruebas unitarias
run: npm test-if-present
